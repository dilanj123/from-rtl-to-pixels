<text x="50" y="80" font-family="Arial,sans-serif" font-size="14" fill="#243b53">Canonical widths: 640x480 =&gt; ROW_W=9, COL_W=10; parameterized expressions remain in inventory</text>
<text x="50" y="960" font-family="Arial,sans-serif" font-size="14" fill="#243b53">Grey output = instantiated/observable but not consumed by production top</text>
<text x="50" y="960" font-family="Arial,sans-serif" font-size="12" fill="#627d98">Solid = pixel/data path   Dashed blue = control/config   Dashed magenta = ready/backpressure   Dashed purple = metadata</text></svg>