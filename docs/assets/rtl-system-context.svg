<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#243b53"/></marker><marker id="ready" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#a23b72"/></marker></defs>
<rect width="100%" height="100%" fill="#f7fafc"/>
<text x="50" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102a43">Streaming Sobel RTL Accelerator — System Context</text>
<text x="50" y="82" font-family="Arial,sans-serif" font-size="15" fill="#486581">Top-level context; A and B are alternative implementations.</text>
<rect x="600" y="170" width="560" height="250" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
<text x="612" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">rtl_to_pixels_top / _pipelined</text>
<text x="612" y="221" font-family="Arial,sans-serif" font-size="13" fill="#243b53">single-clock streaming image accelerator</text>
<rect x="70" y="200" width="380" height="150" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
<text x="82" y="228" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">RGB input stream</text>
<text x="82" y="251" font-family="Arial,sans-serif" font-size="13" fill="#243b53">s_tdata[23:0]  R/G/B</text>
<text x="82" y="269" font-family="Arial,sans-serif" font-size="13" fill="#243b53">s_tvalid, s_tready</text>
<text x="82" y="287" font-family="Arial,sans-serif" font-size="13" fill="#243b53">s_tuser=SOF, s_tlast=EOL</text>
<rect x="1310" y="200" width="400" height="150" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
<text x="1322" y="228" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">8-bit edge output</text>
<text x="1322" y="251" font-family="Arial,sans-serif" font-size="13" fill="#243b53">m_tdata[7:0], m_tvalid</text>
<text x="1322" y="269" font-family="Arial,sans-serif" font-size="13" fill="#243b53">m_tready, m_tuser=SOF</text>
<text x="1322" y="287" font-family="Arial,sans-serif" font-size="13" fill="#243b53">m_tlast=EOL</text>
<rect x="620" y="470" width="270" height="120" rx="8" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
<text x="632" y="498" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Input + frame control</text>
<text x="632" y="521" font-family="Arial,sans-serif" font-size="13" fill="#243b53">pixel_control</text>
<text x="632" y="539" font-family="Arial,sans-serif" font-size="13" fill="#243b53">input admission</text>
<rect x="930" y="470" width="270" height="120" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
<text x="942" y="498" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Pixel datapath</text>
<text x="942" y="521" font-family="Arial,sans-serif" font-size="13" fill="#243b53">gray -&gt; line history -&gt; 3x3</text>
<text x="942" y="539" font-family="Arial,sans-serif" font-size="13" fill="#243b53">Sobel -&gt; threshold</text>
<rect x="1240" y="470" width="270" height="120" rx="8" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
<text x="1252" y="498" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Output control/buffering</text>
<text x="1252" y="521" font-family="Arial,sans-serif" font-size="13" fill="#243b53">geometry, drain</text>
<text x="1252" y="539" font-family="Arial,sans-serif" font-size="13" fill="#243b53">11-bit elastic output</text>
<rect x="620" y="700" width="540" height="150" rx="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
<text x="632" y="728" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">APB3-style configuration</text>
<text x="632" y="751" font-family="Arial,sans-serif" font-size="13" fill="#243b53">psel penable pwrite paddr[7:0] pwdata[31:0]</text>
<text x="632" y="769" font-family="Arial,sans-serif" font-size="13" fill="#243b53">prdata[31:0] pready pslverr</text>
<text x="632" y="787" font-family="Arial,sans-serif" font-size="13" fill="#243b53">CONTROL / THRESHOLD / STATUS / FRAME_COUNT</text>
<line x1="450" y1="275" x2="600" y2="275" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/>
<text x="530" y="270" font-family="Arial,sans-serif" font-size="12" fill="#243b53">RGB stream</text>
<line x1="1160" y1="275" x2="1310" y2="275" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1240" y="270" font-family="Arial,sans-serif" font-size="12" fill="#243b53">edge stream</text>
<line x1="890" y1="530" x2="930" y2="530" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/>
<text x="915" y="525" font-family="Arial,sans-serif" font-size="12" fill="#243b53">accepted pixels</text>
<line x1="1200" y1="530" x2="1240" y2="530" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1225" y="525" font-family="Arial,sans-serif" font-size="12" fill="#243b53">edge tokens</text>
<line x1="1510" y1="530" x2="1510" y2="350" stroke="#a23b72" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ready)"/>
<text x="1515" y="435" font-family="Arial,sans-serif" font-size="12" fill="#a23b72">m_tready</text>
<line x1="890" y1="700" x2="890" y2="590" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
<text x="895" y="640" font-family="Arial,sans-serif" font-size="12" fill="#2b6cb0">config/status</text>
<text x="610" y="135" font-family="Arial,sans-serif" font-size="14" fill="#243b53">Architecture A = compact direct path | Architecture B = one 28-bit post-Gx/Gy elastic boundary</text>
<text x="1450" y="180" font-family="Arial,sans-serif" font-size="14" fill="#243b53">clk / rst: single clock domain, synchronous active-high reset</text>
<text x="50" y="960" font-family="Arial,sans-serif" font-size="12" fill="#627d98">Solid = pixel/data path   Dashed blue = control/config   Dashed magenta = ready/backpressure   Dashed purple = metadata</text></svg>