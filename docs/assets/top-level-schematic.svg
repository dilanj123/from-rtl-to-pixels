<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-labelledby="title desc">
<title id="title">From RTL to Pixels top-level RTL schematic</title>
<desc id="desc">Streaming RGB input flows through pixel control, grayscale, line buffers, a 3 by 3 window, Sobel gradients, alternative Architecture A or B, magnitude and threshold arithmetic, output control and the final output elastic buffer. APB configuration is shown below.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#334e68"/></marker><marker id="ctrlArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#c27c0e"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172b4d}.title{font-size:22px;font-weight:700}.box-title{font-size:15px;font-weight:700}.box-sub{font-size:12px}.note{font-size:12px}.data{stroke:#334e68;stroke-width:4;fill:none;marker-end:url(#arrow)}.control{stroke:#c27c0e;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#ctrlArrow)}.meta{stroke:#8e4f9d;stroke-width:3;stroke-dasharray:10 6;fill:none;marker-end:url(#arrow)}.box{stroke:#506070;stroke-width:1.5}.small{font-size:11px}</style></defs>
<rect width="1600" height="900" fill="#ffffff"/><text x="40" y="36" class="title">From RTL to Pixels — top-level RTL schematic</text>
<text x="40" y="62" class="note">Architecture A is the compact path; Architecture B is an alternative with one post-Gx/Gy 28-bit elastic stage.</text>
<rect x="40" y="88" width="365" height="82" rx="10" fill="#f5f5f5" class="box"/><text x="55" y="112" class="box-title">Legend</text><line x1="55" y1="130" x2="125" y2="130" class="data"/><text x="140" y="134" class="small">pixel / arithmetic data</text><line x1="55" y1="148" x2="125" y2="148" class="control"/><text x="140" y="152" class="small">control / configuration</text><line x1="260" y1="148" x2="330" y2="148" class="meta"/><text x="340" y="152" class="small">metadata / B token</text>
<rect x="430" y="88" width="250" height="62" rx="10" fill="#f5f5f5" class="box"/><text x="445" y="113" class="box-title">Timing</text><text x="445" y="134" class="note">single clock domain · synchronous active-high reset</text>
<rect x="710" y="88" width="820" height="62" rx="10" fill="#f5f5f5" class="box"/><text x="725" y="113" class="box-title">A and B are alternatives</text><text x="725" y="134" class="note">The dashed branch shows the one controlled B difference; both use the same final 11-bit output buffer.</text>
<rect x="40" y="300" width="165" height="86" rx="10" fill="#d9eaf7" class="box"/><text x="52" y="327" class="box-title">RGB888 input</text><text x="52" y="351" class="box-sub">s_tdata / valid / ready / SOF / EOL</text><rect x="235" y="290" width="180" height="106" rx="10" fill="#e8eef5" class="box"/><text x="247" y="317" class="box-title">pixel_control</text><text x="247" y="341" class="box-sub">accept, SOF/EOL, row/column</text><rect x="445" y="300" width="165" height="86" rx="10" fill="#e8eef5" class="box"/><text x="457" y="327" class="box-title">rgb_to_gray</text><text x="457" y="351" class="box-sub">RGB888 → grayscale</text><rect x="640" y="300" width="165" height="86" rx="10" fill="#e8eef5" class="box"/><text x="652" y="327" class="box-title">line_buffer</text><text x="652" y="351" class="box-sub">two-line history</text><rect x="835" y="300" width="180" height="86" rx="10" fill="#e8eef5" class="box"/><text x="847" y="327" class="box-title">window_3x3</text><text x="847" y="351" class="box-sub">3×3 taps / coordinates</text><rect x="1045" y="300" width="165" height="86" rx="10" fill="#f7e4c4" class="box"/><text x="1057" y="327" class="box-title">sobel_compact</text><text x="1057" y="351" class="box-sub">signed Gx / Gy</text><rect x="1250" y="235" width="170" height="70" rx="10" fill="#e3f1df" class="box"/><text x="1262" y="262" class="box-title">Architecture A</text><text x="1262" y="286" class="box-sub">direct Gx/Gy path</text><rect x="1250" y="370" width="220" height="90" rx="10" fill="#f3dfef" class="box"/><text x="1262" y="397" class="box-title">Architecture B</text><text x="1262" y="421" class="box-sub">28-bit elastic token</text><rect x="1490" y="300" width="175" height="86" rx="10" fill="#f7e4c4" class="box"/><text x="1502" y="327" class="box-title">magnitude_clamp</text><text x="1502" y="351" class="box-sub">magnitude + clamp</text><rect x="1685" y="300" width="165" height="86" rx="10" fill="#f7e4c4" class="box"/><text x="1697" y="327" class="box-title">threshold_stage</text><text x="1697" y="351" class="box-sub">threshold / bypass</text><rect x="1870" y="300" width="190" height="98" rx="10" fill="#d9eaf7" class="box"/><text x="1882" y="327" class="box-title">elastic_stage</text><text x="1882" y="351" class="box-sub">11-bit output buffer</text><rect x="2080" y="300" width="175" height="86" rx="10" fill="#d9eaf7" class="box"/><text x="2092" y="327" class="box-title">edge stream</text><text x="2092" y="351" class="box-sub">m_tdata / valid / ready</text><rect x="1685" y="475" width="175" height="100" rx="10" fill="#e8eef5" class="box"/><text x="1697" y="502" class="box-title">output_control</text><text x="1697" y="526" class="box-sub">geometry / border / drain</text><rect x="730" y="610" width="300" height="125" rx="10" fill="#fff2cc" class="box"/><text x="742" y="637" class="box-title">apb_regs</text><text x="742" y="661" class="box-sub">APB3 config + status</text><text x="742" y="678" class="box-sub">run, threshold, bypass, frame count</text><path d="M205 343 H235" class="meta"/><path d="M205 343 H445" class="data"/><path d="M415 343 H640" class="data"/><path d="M610 343 H640" class="data"/><path d="M805 343 H835" class="data"/><path d="M1015 343 H1045" class="data"/><path d="M1210 343 C1230 343 1235 270 1250 270" class="data"/><path d="M1210 343 C1230 343 1235 415 1250 415" class="meta"/><path d="M1420 270 C1460 270 1460 343 1490 343" class="data"/><path d="M1470 415 C1500 415 1500 343 1490 343" class="meta"/><path d="M1665 343 H1685" class="data"/><path d="M1850 343 H1870" class="data"/><path d="M2060 343 H2080" class="data"/><path d="M325 396 C500 520 1500 520 1685 520" class="control"/><path d="M730 665 H600 C560 665 560 520 600 520" class="control"/><path d="M1030 665 H1870 C1900 665 1900 575 1860 575" class="control"/><path d="M1965 398 V475" class="control"/><text x="45" y="820" class="note">B token: final_tag · SOF · EOL · border · Gx · Gy</text><text x="45" y="842" class="note">W+1 alignment / final drain · no frame overlap during drain · FRAME_COUNT increments on external final-token transfer</text><text x="45" y="875" class="note">Dashed branch is illustrative: A and B are separate top-level implementations.</text></svg>